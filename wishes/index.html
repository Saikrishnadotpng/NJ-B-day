<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Leave a birthday note ✦</title>
  <meta name="theme-color" content="#110607" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23c29a5b%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2244%22 text-anchor=%22middle%22 font-family=%22Georgia%22 fill=%22%235e0f16%22%3E19%3C/text%3E%3C/svg%3E" />
  <style>
    @font-face { font-family: "Cormorant"; src: url(../assets/fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2"); font-weight: 500; font-style: italic; font-display: swap; }
    @font-face { font-family: "Cormorant"; src: url(../assets/fonts/cormorant-garamond-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Manrope"; src: url(../assets/fonts/manrope-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Manrope"; src: url(../assets/fonts/manrope-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Caveat"; src: url(../assets/fonts/caveat-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
    :root { --night: #110607; --paper: #fcf8f2; --gold: #c29a5b; --gold-hi: #f0d9a6; --red: #a3202b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100svh; font-family: Manrope, system-ui, sans-serif; color: var(--paper); -webkit-font-smoothing: antialiased;
      background: radial-gradient(120% 70% at 50% 0%, #3a0f15 0%, #1c0a0d 45%, var(--night) 75%); display: flex; align-items: center; justify-content: center; padding: 8vh 6vw; }
    .stars { position: fixed; inset: 0; pointer-events: none; }
    .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--gold-hi); animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .15; } }
    main { position: relative; width: min(100%, 540px); text-align: center; animation: up 1.2s cubic-bezier(.22,1,.36,1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(30px); } }
    .seal { width: 64px; height: 64px; margin: 0 auto 1.6rem; border-radius: 50%; display: grid; place-items: center; font-family: Cormorant, Georgia, serif; font-size: 1.6rem; color: #5e0f16;
      background: radial-gradient(circle at 34% 28%, #f1d9a3, var(--gold) 50%, #7d5a26); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .eyebrow { font-size: .72rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
    h1 { font-family: Cormorant, Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(2.4rem, 9vw, 3.4rem); line-height: 1.05; margin: .8rem 0 1rem; }
    h1 em { color: var(--gold-hi); }
    .lead { color: rgba(252,248,242,.7); font-weight: 400; line-height: 1.6; margin-bottom: 2.2rem; }
    form { display: flex; flex-direction: column; gap: .8rem; text-align: left; }
    input, textarea { width: 100%; background: rgba(255,255,255,.05); border: 1px solid rgba(240,217,166,.3); border-radius: 14px; padding: 1rem 1.1rem; color: var(--paper);
      font-family: Cormorant, Georgia, serif; font-size: 1.2rem; outline: none; resize: vertical; transition: border-color .3s, background .3s; }
    input:focus, textarea:focus { border-color: var(--gold-hi); background: rgba(255,255,255,.08); }
    ::placeholder { color: rgba(252,248,242,.35); font-style: italic; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .count { font-size: .72rem; letter-spacing: .15em; color: rgba(227,207,166,.5); }
    button { border: 0; border-radius: 999px; background: var(--gold); color: var(--night); font-size: .76rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
      padding: 1.05rem 1.8rem; min-height: 48px; cursor: pointer; transition: box-shadow .4s, opacity .3s; }
    button:hover { box-shadow: 0 0 34px rgba(240,217,166,.35); } button:disabled { opacity: .5; }
    .status { min-height: 1.4em; text-align: center; color: rgba(252,248,242,.8); margin-top: .4rem; }
    .done { display: none; }
    .done.show { display: block; animation: up 1s cubic-bezier(.22,1,.36,1) both; }
    .done h2 { font-family: Cormorant, Georgia, serif; font-style: italic; font-weight: 500; font-size: 2.2rem; color: var(--gold-hi); margin-bottom: .6rem; }
    .done p { color: rgba(252,248,242,.7); line-height: 1.6; }
    .done .from { font-family: Caveat, cursive; font-size: 1.6rem; color: var(--gold-hi); margin-top: 1rem; }
    .again { margin-top: 1.8rem; background: transparent; color: var(--gold-hi); border: 1px solid var(--gold); }
    .tally { margin-top: 2.4rem; font-size: .72rem; letter-spacing: .25em; text-transform: uppercase; color: rgba(227,207,166,.55); min-height: 1em; }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <div class="seal">19</div>
    <p class="eyebrow">a birthday surprise</p>
    <h1>Leave a note for <em id="who">Birthday Girl</em></h1>
    <p class="lead" id="lead">Sai is making her a birthday page. Write her something and it'll be pinned on a wall of notes she'll see on her birthday. Shh, it's a surprise.</p>

    <form id="f" autocomplete="off">
      <input id="name" maxlength="40" placeholder="your name" aria-label="Your name" />
      <textarea id="text" maxlength="280" rows="4" placeholder="happy birthday! …" aria-label="Your birthday note"></textarea>
      <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <div class="row"><span class="count" id="count">0 / 280</span><button type="submit" id="btn">pin it ✦</button></div>
      <p class="status" id="status" role="status"></p>
    </form>

    <div class="done" id="done">
      <h2>Pinned ✦</h2>
      <p>Your note is on her wall. She'll see it on her birthday.</p>
      <p class="from" id="doneFrom"></p>
      <button class="again" id="again">write another</button>
    </div>
    <p class="tally" id="tally"></p>
  </main>
  <script>
    /* ── edit these two ── */
    const HER_NAME = "Birthday Girl";
    const FROM_NAME = "Sai";
    /* ─────────────────── */
    const $ = s => document.querySelector(s), API = "../api/messages";
    $("#who").textContent = HER_NAME;
    document.title = `Leave a note for ${HER_NAME} ✦`;
    $("#lead").textContent = `${FROM_NAME} is making her a birthday page. Write her something and it'll be pinned on a wall of notes she'll see on her birthday. Shh, it's a surprise.`;
    for (let i = 0; i < 50; i++) { const s = document.createElement("i"); s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%"; s.style.animationDelay = -Math.random() * 3 + "s"; $(".stars").appendChild(s); }
    const local = /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname) || location.protocol === "file:";
    async function tally() {
      try { const r = await fetch(API, { cache: "no-store" }); if (!r.ok) return; const { notes } = await r.json();
        $("#tally").textContent = notes.length ? `${notes.length} ${notes.length === 1 ? "note" : "notes"} on her wall so far` : "be the first note on her wall"; } catch (e) {}
    }
    tally();
    $("#text").addEventListener("input", e => ($("#count").textContent = `${e.target.value.length} / 280`));
    $("#f").addEventListener("submit", async e => {
      e.preventDefault();
      const text = $("#text").value.trim();
      if (text.length < 2) { $("#status").textContent = "write a little something first ✦"; return; }
      $("#btn").disabled = true; $("#status").textContent = "pinning…";
      try {
        const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("#name").value, text, website: $("#hp").value }) });
        if (r.status === 429) { $("#status").textContent = "that's a lot of love — try again in a few minutes ♥"; return; }
        if (!r.ok) throw new Error(r.status);
        $("#doneFrom").textContent = "— " + ($("#name").value.trim() || "someone who loves you");
        $("#f").style.display = "none"; $("#done").classList.add("show"); $("#status").textContent = ""; tally();
      } catch (err) { $("#status").textContent = local ? "notes only work on the live site" : "couldn't send — check your connection and try again"; }
      finally { $("#btn").disabled = false; }
    });
    $("#again").addEventListener("click", () => { $("#text").value = ""; $("#count").textContent = "0 / 280"; $("#done").classList.remove("show"); $("#f").style.display = ""; $("#text").focus(); });
  </script>
</body>
</html>
